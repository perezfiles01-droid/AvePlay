name: Debug APK

# Publishes the Android debug build as a release asset, so it can be
# downloaded as an .apk and installed straight from the phone.
#
# Actions artifacts are always served as a zip, which a phone cannot install
# without unzipping first. A release asset is served as the file itself, so
# the link goes to the APK.
#
# The release is a prerelease on a fixed tag that is overwritten each time,
# which keeps the download link stable and keeps it out of the way of the
# in-app updater: GitHub's "latest release" ignores prereleases, so this can
# never be mistaken for a real version. It is debug signed and cannot be
# installed over a release build.
#
# The build is profile mode, arm64 only. A --debug build of this app came out
# at 215 MB, and a download that size off a phone browser fails more often
# than it finishes; installing it then needs roughly twice that free, because
# useLegacyPackaging extracts the native libraries. Two things carried the
# weight, and neither is needed to try the app on a handset:
#
#   * every ABI at once - arm64-v8a, armeabi-v7a and x86_64 - 125 MB of
#     native libraries for three architectures when a phone runs one, and
#     every phone worth testing on since about 2018 is arm64;
#   * debug mode itself, whose 60 MB kernel_blob.bin is the Dart source
#     shipped for the JIT, plus a Vulkan validation layer and Rust compiled
#     unoptimised.
#
# Profile mode is AOT compiled and drops all of that, while still being debug
# signed, installable without secrets, and running at release speed.

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    name: Build and publish debug APK
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Java toolchain
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.18.1"

      - name: Setup ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Install flutter_rust_bridge_codegen
        run: cargo install 'flutter_rust_bridge_codegen'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        env:
          # Read by android/app/build.gradle to drop the other architectures
          # from the prebuilt native libraries, which --target-platform alone
          # does not reach.
          AVEPLAY_SINGLE_ABI: arm64-v8a
        run: |
          flutter build apk --profile --target-platform android-arm64
          mv build/app/outputs/flutter-apk/app-profile.apk AvePlay-arm64.apk
          ls -lh AvePlay-arm64.apk

      # A second copy on github.io, because the release asset is not reachable
      # from every network. GitHub serves release pages from github.com but the
      # bytes themselves from objects.githubusercontent.com, and blocklists -
      # Private DNS resolvers, ad blockers - routinely carry that host while
      # leaving github.com alone. The download then fails at zero bytes: the
      # browser has read the size off the redirect and cannot reach the host
      # holding the file. Pages is served from a different domain, which those
      # lists do not block, so this is the copy that works behind one.
      #
      # This is the classic branch source rather than actions/deploy-pages,
      # which deploys through an environment that by default only the default
      # branch may use. A branch needs no such permission, so a build from here
      # publishes without waiting to be merged.
      #
      # The branch is rewritten from scratch on every run rather than added to,
      # so the repository carries one copy of the APK and not one per build.
      - name: Mirror to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p site
          cp AvePlay-arm64.apk site/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>AvePlay test build</title>
          <style>
            body { font: 16px/1.6 system-ui, sans-serif; margin: 0; padding: 2.5rem 1.25rem;
                   background: #12100f; color: #f2ece8; }
            main { max-width: 34rem; margin: 0 auto; }
            h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
            p { color: #c9bfb8; }
            a.dl { display: block; margin: 2rem 0 1rem; padding: 1rem; border-radius: .75rem;
                   background: #f6c1b2; color: #2b1b16; text-align: center; font-weight: 600;
                   text-decoration: none; }
            code { background: #241f1d; padding: .15em .4em; border-radius: .3em; }
          </style>
          <main>
            <h1>AvePlay test build</h1>
            <p>For 64-bit ARM phones and tablets. Not for an emulator.</p>
            <a class="dl" href="AvePlay-arm64.apk">Download the APK</a>
            <p>Debug signed, so it installs alongside rather than over a release
            build. Android will ask you to allow installing from your browser
            the first time.</p>
            <p>Built from <code>COMMIT_SHA</code>.</p>
          </main>
          HTML
          sed -i "s/COMMIT_SHA/${GITHUB_SHA}/" site/index.html
          touch site/.nojekyll
          cd site
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Test build from ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Publish as a prerelease asset
        uses: ncipollo/release-action@v1
        with:
          artifacts: AvePlay-arm64.apk
          tag: debug-latest
          name: Latest debug build
          body: |
            The newest test build, replaced on every push.

            For 64-bit ARM phones and tablets, which is every Android device
            of the last several years. Not for an emulator: there is no
            x86_64 slice in it.

            Debug signed, so it will not install over a release build, and it
            is a prerelease so the in-app updater ignores it.

            Commit: ${{ github.sha }}
          prerelease: true
          allowUpdates: true
          removeArtifacts: true
          commit: ${{ github.sha }}
