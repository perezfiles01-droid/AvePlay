name: Rebuild tracker data

# Run this manually after uploading a newer BA_Master_Tracker.xlsx to the repo.
on:
  workflow_dispatch:
  push:
    paths: ['BA_Master_Tracker.xlsx']
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - run: python3 scripts/build_data.py BA_Master_Tracker.xlsx
      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/tracker.json
          git diff --staged --quiet || git commit -m "Rebuild tracker data from workbook"
          git push
